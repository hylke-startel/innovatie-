<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon-64.png" type="image/png" sizes="64x64"><link rel="icon" href="/favicon-192.png" type="image/png" sizes="192x192"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>
<title>Byte | Trainingsadviseur van Startel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<style>
/* Layout: Startel-huisstijl. Witte kop met logo, crème werkvlak, Byte praat links, de bezoeker rechts in Startel-oranje */
:root{
  --orange:#F15324; --orange-hover:#FF6E42; --orange-deep:#C02B0A; --navy:#002661; --peach:#FFDBC2;
  --bg:#FFFBF5; --surface:#FFFFFF; --ink:#141414; --muted:#69717D; --line:#E6E1DA; --chip-on:#FFDBC2; --on-orange:#FFFFFF; --header:#FFFFFF;
  --font:basier, "DM Sans", "Segoe UI", system-ui, sans-serif;
  --font-medium:BasierMedium, "DM Sans", "Segoe UI", system-ui, sans-serif;
  --font-bold:BasierBold, "DM Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1529; --surface:#142140; --ink:#F3EEE8; --muted:#9AA4B5; --line:#24335A; --chip-on:#3A2A2A; --header:#0F1A33; --peach:#FFDBC2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1529; --surface:#142140; --ink:#F3EEE8; --muted:#9AA4B5; --line:#24335A; --chip-on:#3A2A2A; --header:#0F1A33; --peach:#FFDBC2; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;margin:0;padding-inline:0;padding-block:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--header);border-bottom:1px solid var(--line)}
.top-in{max-width:780px;margin:0 auto;padding-inline:16px;padding-block:12px;display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap}
.logo{height:30px;width:auto;display:block}
.logo .lw{fill:#040606}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo .lw{fill:#F3EEE8}}
:root[data-theme="dark"] .logo .lw{fill:#F3EEE8}
.progress{display:flex;align-items:center;gap:10px;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{width:110px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--orange);transition:width .35s}
.ghost{background:none;border:1px solid var(--line);color:var(--ink);border-radius:48px;padding:6px 14px;font:inherit;font-family:var(--font-medium);font-size:.85rem;cursor:pointer}
.ghost:hover{border-color:var(--orange);color:var(--orange)}
.wrap{max-width:780px;margin:0 auto;padding-inline:16px;position:relative;z-index:0}
.hero{display:flex;gap:16px;align-items:center;padding-block:26px 6px}
.hero .byte{width:76px;height:76px;flex:none}
.hero h1{font-family:var(--font-bold);font-weight:700;font-size:clamp(1.5rem,4.5vw,2.1rem);line-height:1.1;margin:0;letter-spacing:-.01em;text-wrap:balance}
.hero h1 span{color:var(--orange)}
.hero p{margin:4px 0 0;color:var(--muted);max-width:52ch}
#chat{display:flex;flex-direction:column;gap:14px;padding-block:18px 96px}
.msg{max-width:88%;min-width:0}
.bot{align-self:flex-start;display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;align-items:start}
.bot .byte{width:36px;height:36px;margin-top:20px}
.bot .who{font-family:var(--font-medium);font-size:.78rem;color:var(--muted);margin:0 0 4px 2px}
.bot .bubble{background:var(--surface);border:1px solid var(--line);padding:12px 16px;border-radius:4px 18px 18px 18px;box-shadow:0 1px 0 rgba(0,0,0,.03)}
.me{align-self:flex-end;background:var(--orange);color:var(--on-orange);padding:9px 16px;border-radius:18px 18px 4px 18px;font-family:var(--font-medium)}
.bubble ul{margin:.3em 0 .7em;padding-left:1.2em}
.bubble p{margin:0 0 .6em}.bubble p:last-child{margin:0}
.bubble a{color:var(--orange);font-family:var(--font-medium);font-weight:500}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:.94rem;padding:7px 15px;border-radius:48px;cursor:pointer;text-align:left}
.chip:hover:not(:disabled){border-color:var(--orange);color:var(--orange)}
.chip[aria-pressed="true"]{background:var(--chip-on);border-color:var(--orange);color:var(--ink);font-family:var(--font-medium)}
.chip:disabled{cursor:default;opacity:.55}
.chip[aria-pressed="true"]:disabled{opacity:1}
.primary{background:var(--orange);color:var(--on-orange);border:0;border-radius:48px;padding:9px 20px;font:inherit;font-family:var(--font-medium);font-weight:500;cursor:pointer}
.primary:hover:not(:disabled){background:var(--orange-hover)}
.primary:disabled{opacity:.45;cursor:default}
.chip:focus-visible,.ghost:focus-visible,.primary:focus-visible,textarea:focus-visible,.card a:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) :focus-visible{outline-color:var(--peach)!important}}
.cards{display:grid;gap:10px;margin-top:10px}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:6px;min-width:0}
.card.top{border-color:var(--orange)}
.card h3{font-family:var(--font-bold);font-weight:700;font-size:1.05rem;margin:0;line-height:1.25}
.why{margin:0;font-size:.93rem;color:var(--muted)}
.pick{font-family:var(--font-medium);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--orange)}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.78rem;padding:2px 10px;border-radius:48px;border:1px solid var(--line);color:var(--ink)}
.tag.price{font-variant-numeric:tabular-nums;font-family:var(--font-medium)}
.tag.warm{background:var(--peach);border-color:var(--peach);color:#141414}
.card a{color:var(--orange);font-family:var(--font-medium);text-decoration:none;font-size:.92rem}
.card a:hover{text-decoration:underline}
.contact{background:var(--peach);color:#141414;border-radius:16px;padding:14px 18px;font-size:.93rem}
.contact strong{font-family:var(--font-bold)}
.contact a{color:var(--orange-deep)}
.ctas{display:flex;flex-wrap:wrap;gap:8px;margin-block:10px 6px}
.contact a.cta{background:var(--orange);color:#fff;padding:8px 16px;border-radius:48px;text-decoration:none;font-family:var(--font-medium)}
.contact a.cta.alt{background:#fff;color:var(--orange-deep);border:1.5px solid var(--orange)}
.contact a.cta:hover{filter:brightness(1.05)}
.contact .small{font-size:.82rem;color:#4a4a4a}
.copy{user-select:all;font-family:var(--font-medium)}
.dots{display:inline-flex;gap:5px;padding-block:6px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--orange);opacity:.35;animation:dot 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{opacity:.35;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.byte .b-eyes{transform-origin:32px 31px;animation:blink 5s infinite}
.byte{overflow:visible}
.byte .b-arm{opacity:0;transform-origin:51px 44px;transform-box:view-box}
.byte.waving .b-arm{opacity:1;animation:wave 1.9s ease-in-out}
.byte.waving{animation:bob 1.9s ease-in-out}
@keyframes wave{0%{transform:rotate(-40deg)}12%{transform:rotate(0deg)}26%{transform:rotate(-28deg)}40%{transform:rotate(4deg)}54%{transform:rotate(-28deg)}68%{transform:rotate(4deg)}86%{transform:rotate(-10deg)}100%{transform:rotate(-40deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}30%{transform:translateY(-2px)}60%{transform:translateY(1px)}}
.peek{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;align-items:flex-end;gap:8px;transform:translateY(140%);transition:transform .35s ease;pointer-events:none}
.peek.show{transform:translateY(0);pointer-events:auto}
.peek.up{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.peek .byte{width:56px;height:56px;flex:none;filter:drop-shadow(0 2px 6px rgba(0,0,0,.15))}
.peek .say{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px 16px 4px 16px;padding:8px 12px;font-size:.9rem;max-width:220px;box-shadow:0 4px 14px rgba(0,0,0,.08);cursor:pointer}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.b-bg{fill:#FFDBC2}
[hidden]{display:none!important}
.chip.type{border-style:dashed}
.chipwrap{display:inline-flex;align-items:center;gap:4px}
.info{width:24px;height:24px;flex:none;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);font:inherit;font-size:.78rem;font-family:var(--font-bold);font-style:italic;cursor:pointer;line-height:1;padding:0}
.info:hover,.info[aria-expanded="true"]{border-color:var(--orange);color:var(--orange)}
.info:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.infobox{flex-basis:100%;padding:10px 14px;border-radius:12px;background:var(--peach);color:#141414;font-size:.92rem}
.infobox strong{font-family:var(--font-bold);margin-right:4px}
html.v2:not(:has(#w2)) .composer-wrap[hidden]{display:block!important}
.composer-wrap{position:sticky;bottom:0;z-index:5;background:var(--bg);border-top:1px solid var(--line)}
.composer{max-width:780px;margin:0 auto;padding-inline:16px;padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px}
.composer textarea{flex:1;min-width:0;resize:none;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:24px;padding:10px 16px;font:inherit;height:46px}
.composer textarea:focus{border-color:var(--orange);outline:none}
.foot{max-width:780px;margin:0 auto;padding-inline:16px;padding-block:0 18px;font-size:.78rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}.dots i,.byte .b-eyes{animation:none}.peek{transition:none}}
@media (max-width:480px){.msg{max-width:100%}.bar{width:64px}.logo{height:24px}.hero .byte{width:58px;height:58px}}
.aiproef{margin:10px 0 0;font-size:12px;color:#8A8F98}

/* ---------- Versie 2 (proef, ?v=2; ?v=1 terug): een gesprek met Byte, rustig en ruim in Startel-stijl ---------- */
html.v2 .hero{display:none}
html.v2 .wrap,html.v2 .top-in{max-width:860px;padding-inline:24px}
html.v2 .top{background:rgba(255,251,245,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid rgba(0,38,97,.07)}
html.v2 .top-in{padding-block:14px;flex-wrap:nowrap}
html.v2 .progress{gap:14px;font-size:.88rem;color:var(--navy)}
html.v2 #stepLbl{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;transition:opacity .25s}
html.v2 #stepLbl::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--orange);flex:none}
html.v2.klaar #stepLbl::before{width:16px;height:16px;border-radius:50%;background:var(--orange) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='none' stroke='white' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><path d='M4.3 8.4 7 11l4.7-5.4'/></svg>") center/contain no-repeat}
html.v2 .bar{position:absolute;left:0;right:0;bottom:-1px;width:auto;height:3px;border-radius:0;background:rgba(0,38,97,.07)}
html.v2 .bar i{border-radius:0 3px 3px 0;min-width:3%;transition:width .9s cubic-bezier(.22,1,.36,1)}
html.v2 .ghost{border:0;background:none;padding:6px 4px 6px 2px;color:var(--navy);font-size:.88rem;display:inline-flex;align-items:center;gap:6px;opacity:.7;transition:opacity .15s,color .15s}
html.v2 .ghost::before{content:"";width:15px;height:15px;background:currentColor;-webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><path d='M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5'/></svg>") center/contain no-repeat;mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><path d='M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5'/></svg>") center/contain no-repeat}
html.v2 .ghost:hover{opacity:1;color:var(--orange);border:0}
@media (prefers-reduced-motion:reduce){html.v2 .bar i{transition:none}}

/* startscherm */
.w2{margin-top:32px;padding-bottom:40px}
.w2.weg{animation:w2uit .28s ease forwards}
@keyframes w2uit{to{opacity:0;transform:translateY(-8px)}}
.w2-paneel{position:relative;overflow:hidden;background:var(--navy);color:#fff;border-radius:32px;padding:48px 48px 44px;display:grid;grid-template-columns:minmax(0,1fr) 250px;column-gap:28px;
  grid-template-areas:"hoi podium" "kop podium" "vraag podium" "tip podium"}
.w2-hoi{grid-area:hoi;margin:0;font-family:var(--font-medium);font-size:1.02rem;line-height:1.45;color:var(--peach);max-width:34ch;animation:w2op .5s .15s ease both}
.w2 h1{grid-area:kop;margin:12px 0 0;font-family:var(--font-bold);font-weight:700;font-size:clamp(2rem,5.2vw,3.15rem);line-height:1.04;letter-spacing:-.025em;color:#fff;text-wrap:balance;animation:w2op .6s .3s cubic-bezier(.2,.8,.2,1) both}
.w2-vraag{grid-area:vraag;margin-top:30px;display:flex;align-items:flex-end;gap:10px;background:#fff;border-radius:20px;padding:10px 10px 10px 20px;box-shadow:0 14px 34px rgba(0,0,0,.2);animation:w2op .6s .45s cubic-bezier(.2,.8,.2,1) both;transition:box-shadow .15s}
.w2-vraag:focus-within{box-shadow:0 0 0 3px var(--orange),0 14px 34px rgba(0,0,0,.2)}
.w2-vraag textarea{flex:1;min-width:0;border:0;outline:0;resize:none;font:inherit;font-size:1.04rem;color:#141414;background:none;padding:9px 0;line-height:1.45;min-height:52px;max-height:160px;field-sizing:content}
.w2-vraag textarea::placeholder{color:#8A8F98}
.w2-stuur{flex:none;width:48px;height:48px;border-radius:14px;border:0;background:var(--orange);color:#fff;display:grid;place-items:center;cursor:pointer;transition:background .15s,transform .15s}
.w2-stuur:hover{background:var(--orange-hover)}
.w2-stuur:active{transform:scale(.95)}
.w2-stuur:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.w2-tip{grid-area:tip;margin:14px 2px 0;font-size:.9rem;line-height:1.5;color:rgba(255,255,255,.72);max-width:46ch;animation:w2op .6s .55s ease both}
@keyframes w2op{from{opacity:0;transform:translateY(10px)}}
/* Byte staat in de hoek van de Startel-pijl */
.w2-podium{grid-area:podium;position:relative;align-self:end;width:100%;aspect-ratio:26/25;margin-bottom:-52px;pointer-events:none}
.w2-pijl{position:absolute;left:0;top:0;width:92%;height:auto;fill:var(--peach);animation:w2pijl .7s .1s cubic-bezier(.2,.8,.2,1) both}
.w2-podium .btwrap{position:absolute;left:22%;top:0%;width:78%;animation:w2byte .7s .35s cubic-bezier(.3,1.5,.5,1) both}
@keyframes w2pijl{from{opacity:0;transform:translate(-14px,14px)}}
@keyframes w2byte{from{opacity:0;transform:translateY(26px) scale(.86)}}
.w2-of{margin:34px 4px 14px;font-family:var(--font-medium);font-size:.95rem;color:var(--muted)}
.w2-tegels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.w2-tegel{display:flex;align-items:center;gap:13px;text-align:left;border:0;background:var(--surface);color:var(--ink);border-radius:18px;padding:14px 16px;font:inherit;font-family:var(--font-medium);font-size:.97rem;line-height:1.25;cursor:pointer;box-shadow:0 0 0 1px var(--line);transition:box-shadow .16s,transform .16s}
.w2-tegel:hover{box-shadow:0 0 0 1.5px var(--navy),0 8px 22px rgba(0,38,97,.09);transform:translateY(-1px)}
.w2-tegel:focus-visible{outline:2px solid var(--navy);outline-offset:3px}
.w2-tegel i{flex:none;width:40px;height:40px;border-radius:12px;background:#FFEEE2;color:var(--orange);display:grid;place-items:center}
.w2-tegel.twijfel{box-shadow:none;border:1.5px dashed #D3CBBE;background:transparent}
.w2-tegel.twijfel i{background:#E9EEF6;color:var(--navy)}
.ai-regel{display:none}
@media (min-width:721px){html.v2 .ai-regel{display:block;margin:10px auto 0;max-width:880px;text-align:center;font-size:.8rem;color:var(--muted)}}
.w2-ai{margin:26px 4px 0;font-size:.82rem;color:var(--muted);max-width:60ch}
@media (max-width:720px){
  html.v2 .wrap,html.v2 .top-in{padding-inline:16px}
  .w2{margin-top:18px}
  .w2-paneel{border-radius:26px;padding:22px 20px 24px;grid-template-columns:minmax(0,1fr) 124px;column-gap:8px;grid-template-areas:"hoi podium" "kop kop" "vraag vraag" "tip tip"}
  .w2-hoi{align-self:center;font-size:.98rem}
  .w2-podium{margin-bottom:0;align-self:start}
  .w2 h1{margin-top:6px}
  .w2-vraag{margin-top:20px;padding-left:16px}
  .w2-tegels{grid-template-columns:1fr 1fr;gap:10px}
  .w2-tegel{padding:11px 12px;font-size:.9rem;gap:10px;border-radius:16px}
  .w2-tegel i{width:34px;height:34px;border-radius:10px}
  .w2-tegel.twijfel{grid-column:1/-1}
}

/* het gesprek */
html.v2 #chat{gap:18px;padding-block:28px 130px}
html.v2 .msg{animation:msgIn .34s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}}
html.v2 .bot{grid-template-columns:92px minmax(0,1fr);gap:10px;align-items:end;max-width:100%;width:100%}
html.v2 .bot .figplek{width:96px;margin:0 -2px -6px;align-self:end;position:sticky;bottom:calc(var(--dock,104px) + 6px)}
html.v2 .msg{scroll-margin-top:84px}
html.v2 .bot .byte{display:none}
html.v2 .bot .who{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
html.v2 .bot .bubble{border:0;border-radius:22px 22px 22px 6px;padding:16px 20px;max-width:640px;width:fit-content;font-size:1.02rem;box-shadow:0 1px 0 rgba(0,38,97,.04),0 10px 30px rgba(0,38,97,.07)}
html.v2 .bubble .w{opacity:0;animation:wIn .32s ease forwards}
@keyframes wIn{to{opacity:1}}
html.v2 .bubble>:not(.o):not(.dots){animation:naIn .42s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--na,0ms)}
@keyframes naIn{from{opacity:0;transform:translateY(6px)}}
html.v2 .me{background:var(--navy);border-radius:22px 22px 6px 22px;padding:11px 18px;max-width:78%;font-size:1.02rem}
html.v2 .opts{gap:9px;margin-top:14px}
html.v2 .chip{border:1.5px solid #E3DCD2;padding:9px 16px;font-size:.95rem;transition:border-color .15s,color .15s,background .15s}
html.v2 .chip:hover:not(:disabled){border-color:var(--navy);color:var(--navy)}
html.v2 .chip[aria-pressed="true"]{background:#FFEEE2;border-color:var(--orange)}
html.v2 .infobox{background:#FFEEE2;border-radius:14px}
html.v2 .cards{gap:12px;margin-top:14px}
html.v2 .cards.voorstel{margin:4px 0 14px}
/* desktop: beste match groot in het midden, twee alternatieven ernaast */
.vgl-wrap{margin-top:14px}
.vgl-knop{display:inline-flex;align-items:center;gap:8px;background:#fff;color:var(--navy);border:2px solid var(--navy);border-radius:999px;padding:9px 20px;font:inherit;font-family:var(--font-bold);font-weight:700;font-size:.95rem;cursor:pointer}
.vgl-knop:hover{background:var(--navy);color:#fff}
.vgl-knop:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.vgl-tabel{margin-top:12px;overflow-x:auto;border:1.5px solid var(--line);border-radius:16px;background:var(--surface)}
.vgl-tabel table{width:100%;border-collapse:collapse;font-size:.93rem;min-width:520px}
.vgl-tabel th,.vgl-tabel td{padding:12px 14px;text-align:left;vertical-align:top;border-top:1px solid var(--line)}
.vgl-tabel thead th{border-top:0;font-family:var(--font-bold);color:var(--navy);font-size:1rem;line-height:1.25}
.vgl-tabel thead th.top{box-shadow:inset 0 -3px 0 var(--orange)}

/* Byte: één getekend figuurtje met losse onderdelen; de toestand staat in data-st (rust, zwaai, denk, typ, juich, blij, meeleef) */
.btwrap{display:block}
.bt{position:relative;display:block;width:100%;aspect-ratio:1;user-select:none;pointer-events:none;transform-origin:50% 96%;animation:btAdem 3.4s ease-in-out infinite}
.bt-s{position:absolute;inset:0;background:url(/img/b4-rust.webp) center/100% 100% no-repeat}
/* zwaaien: de 8 beeldjes van de animatie, twee keer achter elkaar */
.bt-s.film{background-image:url(/img/b4-zwaai.webp);background-size:800% 100%;background-position:0 0;animation:btFilm 1.12s steps(8,jump-none) 2 both}
@keyframes btFilm{from{background-position:0% 0}to{background-position:100% 0}}
@keyframes btAdem{0%,100%{transform:scale(1,1)}50%{transform:scale(1.018,.978)}}
/* knipperen: een ooglid in de kleur van het gezicht, met een boogje */
.bt-k{position:absolute;opacity:0;animation:btKnip 4.6s infinite;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 46' preserveAspectRatio='none'><ellipse cx='20' cy='23' rx='20' ry='23' fill='%23F6DBC1'/><path d='M6 24c5 7 23 7 28 0' fill='none' stroke='%2317172B' stroke-width='5' stroke-linecap='round'/></svg>") center/100% 100% no-repeat}
@keyframes btKnip{0%,94%,100%{opacity:0}95%,97.5%{opacity:1}}
.bt-x{position:absolute;right:6%;top:0;width:20%;height:auto;animation:btPop .4s cubic-bezier(.3,1.5,.5,1) both,btZweef 2.2s ease-in-out .4s infinite}
.bt-x.hart{right:4%;top:6%;width:22%}
@keyframes btPop{from{opacity:0;transform:translateY(30%) scale(.4)}}
@keyframes btZweef{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-8%) rotate(7deg)}}
/* elke toestand heeft een rustige eigen beweging */
.bt[data-st="zwaai"]{animation:none}
.bt[data-st="denk"]{animation:btDenk 2.6s ease-in-out infinite}
.bt[data-st="typ"]{animation:btTik .26s ease-in-out infinite alternate}
.bt[data-st="juich"]{animation:btSpring .7s cubic-bezier(.3,0,.4,1) 2,btAdem 3.4s ease-in-out 1.4s infinite}
.bt[data-st="blij"]{animation:btDein 1.8s ease-in-out infinite}
.bt[data-st="meeleef"]{animation:btDenk 3.2s ease-in-out infinite}
@keyframes btDenk{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes btTik{from{transform:translateY(0)}to{transform:translateY(-1.6%)}}
@keyframes btSpring{0%,100%{transform:translateY(0) scale(1,1)}12%{transform:translateY(1%) scale(1.07,.91)}48%{transform:translateY(-12%) scale(.96,1.05)}88%{transform:translateY(.5%) scale(1.04,.95)}}
@keyframes btDein{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg) translateY(-2%)}}
@media (prefers-reduced-motion:reduce){.bt,.bt *,.w2 *,html.v2 .msg,html.v2 .bubble *{animation:none!important;transition:none!important}html.v2 .bubble .w{opacity:1}}

const DONTKNOW = /^(ik )?(weet (ik )?(het )?(nog )?niet|geen (flauw )?idee|maakt (me |mij )?(niet|niks)( zoveel)? uit|geen voorkeur|geen idee eigenlijk)/;
async function classify(text, set){
  if(!serverOk) return null;
  const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), 5000);
  try {
    const r = await fetch("/api/classify", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text, set }), signal: ctl.signal });
    if(!r.ok) return null;
    const d = await r.json(); return d.ready && d.results?.length > 1 ? d.results : null;
  } catch(e){ return null; } finally { clearTimeout(timer); }
}
function dotsMsg(pose){ return botMsg('<span class="dots" aria-label="Byte denkt na"><i></i><i></i><i></i></span>', pose || "denk").closest(".msg"); }

async function answer(text, fromChip){
  text = String(text).trim(); if(!text || thinking) return;
  lockOpts(); meMsg(text); closeTyping();
  if(phase === "advice") return followUp(text, fromChip);
  const q = current; asked.add(q.id);
  if(fromChip){ q.pick(text); return next(); }
  if(q.open) P.open = (P.open || 0) + 1;
  if(V2 && AI_AAN && await getypt2(text, q)) return;
  thinking = true;
  const dots = dotsMsg();
  if(q.id === "extra") P.extra = text;
  const notes = parseText(text, q.field);
  const low = text.toLowerCase().trim();
  let clarifyWith = null;
  if(DONTKNOW.test(low) && q.field && q.field !== "extra"){
    if(q.field === "vorm" && !P.vorm){ P.vorm = FORMS[4]; notes.push(ACK.vorm(FORMS[4])); }
    else if(q.field === "thema" && !P.thema.size){ q.pick("Help me kiezen"); notes.push("ik kies onderwerpen die bij je rol passen"); }
    else if(P[q.field] === null) notes.push(DK);
  } else if(INTENT_FIELDS.includes(q.field) && P[q.field] === null){
    const r = await classify(text, q.field);
    if(r){
      if(r[0].s - r[1].s >= 0.02){ q.pick(r[0].label); notes.push(ACK[q.field](r[0].label)); }
      else clarifyWith = r.slice(0, 3).map(x => x.label);
    } else {
      const hit = q.opts().find(o => o.toLowerCase().includes(low) || low.includes(o.toLowerCase().split(/[ ,/]/)[0]));
      if(hit){ q.pick(hit); notes.push(ACK[q.field](hit)); }
    }
  }
  const sem = await understand(text, q.field);
  sem.forEach(l => { const n = ACK.thema(l); if(!notes.includes(n)) notes.push(n); });
  dots.remove();
  if(clarifyWith){
    // Gaat het antwoord eigenlijk over een andere vraag? Neem dat over en stel de huidige vraag opnieuw.
    let alt = null;
    if(!notes.filter(n => n !== DK).length){
      for(const f of INTENT_FIELDS){
        if(f === q.field || P[f] !== null) continue;
        const r2 = await classify(text, f);
        if(r2 && r2[0].s - r2[1].s >= 0.03 && r2[0].s >= 0.9 && (!alt || r2[0].s > alt.s)) alt = { f, label: r2[0].label, s: r2[0].s };
      }
      if(alt){ QS.find(x => x.field === alt.f).pick(alt.label); notes.push(ACK[alt.f](alt.label)); }
    }
    if(alt || notes.filter(n => n !== DK).length){ asked.delete(q.id); clarifyWith = null; }
  }
  if(clarifyWith){ thinking = false; return clarify(q, clarifyWith, notes); }
  if(notes.length) pendingAck = notes;
  next();
}

function clarify(q, options, notes){
  const rest = notes.filter(n => n !== DK);
  const pre = rest.length ? `<p>${esc(cap(joinNl(rest)))}.</p>` : "";
  const b = botMsg(pre + `<p>Ik wil het goed begrijpen. Bedoel je een van deze?</p>`);
  b.append(chips([...options, "Iets anders"], { onPick: v => {
    if(thinking) return;
    lockOpts(); meMsg(v);
    if(v === "Iets anders"){ asked.delete(q.id); pendingAck = null; }
    else { q.pick(v); pendingAck = [ACK[q.field](v)]; }
    next();
  } }));
}

/* ---------- Taalmodel op de server ---------- */
let serverOk = true;
async function loadServerCatalog(){
  try {
    const r = await fetch("/api/catalog", { cache: "no-store" }); if(!r.ok) return;
    const d = await r.json(); if(!Array.isArray(d.items) || d.items.length < CATALOG.length) return;
    // de server kent het volledige aanbod van startel.nl: trainingen die niet in de ingebouwde lijst staan komen erbij (zelfde volgorde)
    if(d.items.length > CATALOG.length && d.items.slice(0, CATALOG.length).every((x, i) => x.name === CATALOG[i].name)){
      d.items.slice(CATALOG.length).forEach(x => CATALOG.push({ name: x.name, url: x.url, tags: (x.tags || []).filter(Boolean), lvl: x.lvl || "I", days: x.days || "", fmt: x.fmt || "k", cert: !!x.cert, price: x.price ?? null }));
    }
    if(d.items.length !== CATALOG.length) return;
    d.items.forEach((x, i) => { if(x.name !== CATALOG[i].name) return; Object.assign(CATALOG[i], { lvl: x.lvl || CATALOG[i].lvl, days: x.days || CATALOG[i].days, fmt: x.fmt || CATALOG[i].fmt, price: x.price ?? null }); });
  } catch(e){}
}
async function semMatch(text){
  if(!serverOk) return null;
  const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), 5000);
  try {
    const r = await fetch("/api/match", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }), signal: ctl.signal });
    if(r.status === 404){ serverOk = false; return null; }
    if(!r.ok) return null;
    const d = await r.json(); if(!d.ready || !d.results?.length) return null;
    const top = d.results[0].s, low = d.results[d.results.length - 1].s, span = Math.max(top - low, 1e-6);
    return d.results.map(x => ({ i: x.i, n: (x.s - low) / span }));
  } catch(e){ return null; } finally { clearTimeout(timer); }
}
/* Verwerk een getypte zin: onthoud welke trainingen erbij passen en leid er onderwerpen uit af */
async function understand(text, field){
  const res = await semMatch(text);
  if(!res) return [];
  res.forEach(x => P.sem.set(x.i, Math.max(P.sem.get(x.i) || 0, x.n)));
  const weight = {};
  res.slice(0, 8).forEach(x => CATALOG[x.i].tags.forEach(g => THEMES.forEach(th => { if(th.tags.includes(g)) weight[th.id] = (weight[th.id] || 0) + x.n; })));
  const ranked = Object.entries(weight).sort((a, b) => b[1] - a[1]);
  const added = [];
  if(ranked.length && (field === null || field === "thema" || field === "extra" || P.thema.size === 0)){
    const [best, w] = ranked[0];
    if(!P.thema.has(best) && w >= 2){ P.thema.add(best); added.push(THEMES.find(t => t.id === best).label); }
  }
  return added;
}

/* ---------- Matching ---------- */
function wantLevel(){ const base = { "Nog geen":0, "Basiskennis":0, "Gevorderd, dagelijks mee bezig":1, "Expert, ik wil me specialiseren":2 }[P.niveau]; if(base === undefined) return null; return Math.max(0, Math.min(2, base + P.levelShift)); }
function themeTags(){ return [...P.thema].flatMap(id => THEMES.find(x => x.id === id).tags); }
function score(t){
  let s = 0; const tags = new Set(t.tags), tt = themeTags(), name = t.name.toLowerCase();
  tt.forEach(x => { if(tags.has(x)) s += 4; });
  if(P.rol) P.rol.tags.forEach(x => { if(tags.has(x)) s += 2; });
  P.words.forEach(w => { if(name.includes(w)) s += 6; });
  const want = wantLevel(), have = "BIA".indexOf(t.lvl);
  if(want !== null){ const d = Math.abs(have - want); s += d === 0 ? 3 : d === 1 ? 0 : -4; if(P.niveau === "Basiskennis" && have === 1 && P.levelShift === 0) s += 1; }
  if(P.doel === GOALS[0] && t.cert) s += 3;
  if(P.doel === GOALS[2] && (tags.has("basis") || have === 0)) s += 2;
  if(P.doel === GOALS[3] && tags.has("ai")) s += 3;
  if(P.doel === GOALS[4] && (tags.has("soft") || tags.has("lead"))) s += 3;
  if(P.vorm === FORMS[2]) s += t.fmt === "z" ? 3 : -1; else if(P.vorm && P.vorm !== FORMS[4] && t.fmt === "z") s -= 3;
  const days = +t.days || 0;
  if(P.tijd === TIMES[0]){ if(days === 1) s += 2; else if(days >= 3) s -= 2; }
  if(P.tijd === TIMES[1] && days >= 2 && days <= 3) s += 2;
  if(P.tijd === TIMES[2] && days >= 4) s += 2;
  const sem = P.sem.get(CATALOG.indexOf(t)) || 0;
  s += 10 * sem;
  if(tt.length && !tt.some(x => tags.has(x)) && ![...P.words].some(w => name.includes(w)) && sem < 0.6) s -= 6;
  ["github","studio"].forEach(q => { if(name.includes(q) && ![...P.words].some(w => w.includes(q))) s -= 5; });
  if(P.certOnly && !t.cert) s -= 100;
  return s;
}
function ranked(exclude){ return CATALOG.map((t,i) => ({ t, i, s: score(t) })).filter(x => !exclude.has(x.i)).sort((a,b) => b.s - a.s); }

function reasons(t){
  const r = [], tags = new Set(t.tags), name = t.name.toLowerCase();
  const th = [...P.thema].map(id => THEMES.find(x => x.id === id)).filter(x => x.tags.some(g => tags.has(g))).map(x => x.label);
  if((P.sem.get(CATALOG.indexOf(t)) || 0) >= 0.7) r.push("sluit goed aan bij wat je beschreef");
  if(th.length) r.push("past bij je interesse in " + th.join(" en "));
  const w = [...P.words].filter(x => name.includes(x)); if(w.length) r.push(`gaat over "${w[0]}", dat noemde je`);
  if(P.rol && P.rol.tags.some(g => tags.has(g))) r.push(`sluit aan op je rol als ${P.rol.short}`);
  const want = wantLevel(); if(want !== null && "BIA".indexOf(t.lvl) === want) r.push(`niveau ${LVL[t.lvl].toLowerCase()}, passend bij je ervaring`);
  if(P.doel === GOALS[0] && t.cert) r.push("met erkende certificering");
  if(P.vorm === FORMS[2] && t.fmt === "z") r.push("in je eigen tempo");
  const d = +t.days; if(d && P.tijd && ((P.tijd === TIMES[0] && d === 1) || (P.tijd === TIMES[1] && d >= 2 && d <= 3) || (P.tijd === TIMES[2] && d >= 4))) r.push(`${d} ${d === 1 ? "dag" : "dagen"}, past in je planning`);
  if(!r.length) return "";
  const s = r.slice(0,3).join(", "); return s.charAt(0).toUpperCase() + s.slice(1) + ".";
}

// de AI leest een getypt bericht: eerst de poortwachter, dan wat eruit te halen is

    const a = await r.json(); if(a.sessie) SESSIE = a.sessie; if(a.soort === "leerwens"){ P._weiger = 0; (P.verteld = P.verteld || []).push(tekst.slice(0, 500)); } return a;
  } catch(e){ return null; }
}

// Byte twijfelt wat je bedoelt en vraagt het na. De keuze (of wat je typt) gaat daarna gewoon weer langs de AI.

function neemOver(a){
  const notes = [];
  (a.thema || []).forEach(id => { if(THEMES.some(t => t.id === id) && !P.thema.has(id)){ P.thema.add(id); notes.push(ACK.thema(THEMES.find(x => x.id === id).label)); } });
  if(a.voor && !P.voor){ P.voor = a.voor; notes.push(ACK.voor(a.voor)); }
  if(a.rol && !P.rol){ P.rol = ROLES.find(r => r.label === a.rol) || null; if(P.rol) notes.push(ACK.rol(a.rol)); }
  if(a.niveau && !P.niveau && LEVELS.includes(a.niveau)){ P.niveau = a.niveau; notes.push(ACK.niveau(a.niveau)); }
  if(a.vorm && !P.vorm && FORMS.includes(a.vorm)){ P.vorm = a.vorm; notes.push(ACK.vorm(a.vorm)); }
  if(a.certificaat && !P.doel){ P.doel = GOALS[0]; notes.push("je wilt een certificaat halen"); }
  if(a.reactie) P._reactie = a.reactie;
  P._vervolg = a.vervolgvraag || null;
  // Byte weet al vrijwel zeker welke training past: die laat hij meteen zien
  if(Number.isInteger(a.voorstel) && CATALOG[a.voorstel]){ P._voorstel = a.voorstel; P.sem.set(a.voorstel, Math.max(P.sem.get(a.voorstel) || 0, 1.4)); }                       // de open vervolgvraag die Byte zelf bedenkt
  if(a.onderwerp) P.onderwerp = a.onderwerp;                 // het onderwerp in de woorden van de bezoeker
  if(a.past === "nee"){ P._geenAanbod = true; P.onderwerp = null; }
  return notes;
}

async function begin2(tekst, gekozen){
  const w = document.getElementById("w2"); if(!w || w.dataset.weg) return; w.dataset.weg = "1";

  if(gekozen){ meMsg(gekozen); return next2(); }
  meMsg(tekst);
  thinking = true; const dots = dotsMsg();
  const a = await vraagBegrijp(tekst);
  if(a && a.soort && a.soort !== "leerwens"){ dots.remove(); thinking = false; if(!weigering2(a)) weigerStart(); return; }
  P.extra = tekst;
  if(a && a.navraag){ dots.remove(); thinking = false; P.open = 0; return navraag2(a); }
  const notes = a ? neemOver(a) : [];
  // trefwoorden vullen aan wat nog leeg is (en zijn alles als de AI er niet is)
  parseText(tekst, null).forEach(n => { if(!notes.includes(n)) notes.push(n); });
  // altijd ook het eigen taalmodel laten meekijken: dat helpt bij het kiezen van de trainingen
  const sem = await understand(a && a.zoekterm ? a.zoekterm + ". " + tekst : tekst, null);
  sem.forEach(l => { const n = ACK.thema(l); if(!notes.includes(n)) notes.push(n); });
  dots.remove(); thinking = false;
  if(notes.length) pendingAck = notes;
  next2();
}
// een getypt antwoord tijdens de vragen. Geeft false terug als de AI er niet is of er niets uit haalt (dan de oude weg).
async function getypt2(text, q){
  if(DONTKNOW.test(text.toLowerCase().trim())) return false;
  thinking = true; const dots = dotsMsg();
  const a = await vraagBegrijp(text);
  if(!a){ dots.remove(); thinking = false; return false; }
  if(a.soort !== "leerwens"){ dots.remove(); thinking = false; asked.delete(q.id); if(q.open){ P.open--; P._vervolg = P._laatsteOpen; } if(!weigering2(a)) next2(); return true; }
  P.extra = (P.extra ? P.extra + " " : "") + text;
  if(a.navraag){ dots.remove(); thinking = false; if(q.open) P.open--; navraag2(a); return true; }
  const notes = neemOver(a);
  parseText(text, q.field).forEach(n => { if(!notes.includes(n)) notes.push(n); });
  const sem = await understand(a.zoekterm ? a.zoekterm + ". " + text : text, q.field);
  sem.forEach(l => { const n = ACK.thema(l); if(!notes.includes(n)) notes.push(n); });
  dots.remove(); thinking = false;
  if(!notes.length && !q.open){ P._reactie = null; return false; }
  if(q.field && (q.field === "thema" ? !P.thema.size : P[q.field] === null)) asked.delete(q.id);   // deze vraag is nog niet beantwoord
  pendingAck = notes; next2();
  return true;
}
